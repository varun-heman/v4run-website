<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>v4run | The Blue Pill</title>
<meta name="description" content="You took the blue pill.">
<meta name="theme-color" content="#080808">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/scripts/pill-button.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #080808;
  --fg: #e8e8e2;
  --fg-dim: rgba(232, 232, 226, 0.38);
  --accent: #b8f0d2;
  --green: 100, 255, 160;
  --blue: 58, 178, 255;
  --mono: 'Space Mono', 'Courier New', monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body {
  width: 100%; min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
body { overflow-x: hidden; }

/* the same scanline the rest of the site wears */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg,
    transparent, transparent 2px,
    rgba(0,0,0,0.035) 2px, rgba(0,0,0,0.035) 4px);
  pointer-events: none; z-index: 60;
}

/* a very quiet blue wash, so the room you chose has a colour */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 70% 55% at 50% 45%,
    rgba(var(--blue), 0.07) 0%, rgba(var(--blue), 0.02) 45%, transparent 75%);
  pointer-events: none; z-index: 0;
}

.corner {
  position: fixed; z-index: 20;
  font-family: var(--mono);
  font-size: 10px; letter-spacing: 0.08em; line-height: 1.7;
  opacity: 0;
  animation: bp-fade 1.4s ease 0.5s forwards;
}
.corner-tl { top: 28px; left: 32px; }
.corner-tr { top: 28px; right: 32px; }
.corner-bl { bottom: 28px; left: 32px; }
@keyframes bp-fade { to { opacity: 1; } }

.logo {
  font-family: var(--mono); font-size: 17px; font-weight: 700;
  color: var(--fg); letter-spacing: -0.01em;
}
.c-sub {
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(var(--blue), 0.55);
  margin-top: 5px;
}
.back-link, .back-link:link, .back-link:visited {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--fg-dim); text-decoration: none;
  transition: color 0.2s;
}
.back-link:hover { color: var(--accent); }

main {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 120px 24px;
  text-align: center;
}
.bp-panel {
  position: relative;
  width: min(560px, 100%);
  padding: 44px 44px 40px;
  background: rgba(4, 6, 9, 0.9);
  border: 1px solid rgba(var(--blue), 0.18);
  box-shadow: 0 0 80px rgba(0,0,0,0.9),
              0 0 0 1px rgba(var(--blue), 0.05),
              inset 0 0 40px rgba(0,0,0,0.5);
  opacity: 0;
  animation: bp-panel-in 0.9s cubic-bezier(0.16,1,0.3,1) 0.25s forwards;
}
@keyframes bp-panel-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}
.bp-panel::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg,
    transparent, transparent 3px,
    rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
  pointer-events: none;
}
.bp-corner {
  position: absolute; width: 11px; height: 11px;
  border-color: rgba(var(--blue), 0.5); border-style: solid;
}
.bp-corner--tl { top: -1px; left: -1px;  border-width: 1px 0 0 1px; }
.bp-corner--tr { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
.bp-corner--bl { bottom: -1px; left: -1px;  border-width: 0 0 1px 1px; }
.bp-corner--br { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

.bp-head {
  position: relative; z-index: 1;
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(var(--blue), 0.55);
  margin-bottom: 22px;
}
.bp-title {
  position: relative; z-index: 1;
  font-family: var(--mono);
  font-size: clamp(24px, 3.6vw, 38px);
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(150, 215, 255, 0.95);
  text-shadow: 0 0 34px rgba(var(--blue), 0.4);
  margin-bottom: 18px;
}
.bp-body {
  position: relative; z-index: 1;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.8;
  color: rgba(232, 232, 226, 0.5);
}
.bp-body p + p { margin-top: 14px; }

@media (max-width: 640px) {
  .corner-tl { top: 18px; left: 18px; }
  .corner-tr { top: 18px; right: 18px; }
  .corner-bl { bottom: 18px; left: 18px; }
  .bp-panel { padding: 34px 26px 30px; }
}
</style>
</head>
<body>

<div class="corner corner-tl">
  <div class="logo">v4run</div>
  <div class="c-sub">// blue.pill</div>
</div>

<div class="corner corner-tr">
  <button class="pill-swap pill-swap--red" id="take-red"
          aria-label="Go back and take the red pill instead">
    <span class="pill-swap__glow" aria-hidden="true"></span>
    <span class="pill-swap__pill" aria-hidden="true">
      <i class="pill-swap__mote"></i><i class="pill-swap__mote"></i>
      <i class="pill-swap__mote"></i><i class="pill-swap__mote"></i>
    </span>
    <span class="pill-swap__label" aria-hidden="true">Take the red pill</span>
  </button>
</div>

<main>
  <div class="bp-panel">
    <div class="bp-corner bp-corner--tl"></div><div class="bp-corner bp-corner--tr"></div>
    <div class="bp-corner bp-corner--bl"></div><div class="bp-corner bp-corner--br"></div>
    <div class="bp-head">// blue pill &middot; placeholder</div>
    <h1 class="bp-title">Back to normal</h1>
    <div class="bp-body">
      <p>You took the blue pill. The story ends, you wake up in your bed, and
         you believe whatever you want to believe.</p>
      <p>This room is still being built.</p>
    </div>
  </div>
</main>

<div class="corner corner-bl">
  <a class="back-link" href="/">&larr; v4.run</a>
</div>

<script src="/scripts/plume-transition.js"></script>
<script>
(function () {
  'use strict';
  var btn = document.getElementById('take-red');
  if (!btn) return;
  btn.addEventListener('click', function () {
    // He talks you back across the black, then the world arrives on the bang —
    // no gate, no choice, no typing, since all of that already happened.
    if (window.plumeTransition) window.plumeTransition('/audio/backtored.mp3', '/?enter=bang');
    else window.location.href = '/?enter=bang';
  });
})();
</script>
</body>
</html>
